spring:
  application:
    name: knowledge-resolution-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_resolution_db}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate        # Hibernate only checks the schema; Flyway owns all changes
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
