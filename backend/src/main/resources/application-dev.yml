# Local development ONLY. Activated with SPRING_PROFILES_ACTIVE=dev.
spring:
  flyway:
    # db/dev-seed holds development-only sample data (R__dev_seed_data.sql). Never enable in production.
    locations: classpath:db/migration,classpath:db/dev-seed

server:
  # Bind to localhost so the unauthenticated dev APIs are not reachable from other machines.
  address: 127.0.0.1

app:
  cors:
    allowed-origins: http://localhost:5173
