# Local PostgreSQL 16 for development. Credentials come from .env (not committed).
services:
  postgres:
    image: postgres:16
    container_name: kr-postgres
    environment:
      POSTGRES_DB: knowledge_resolution_db
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d knowledge_resolution_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
